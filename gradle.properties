org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# GeckoView is pulled from Mozilla's Maven server as a normal dependency (nothing is forked).
# LATEST = CI looks up the newest release and builds with it. Replace with a real version
# (for example 150.0.20260101000000) to pin it.
geckoVersion=LATEST
geckoArtifact=geckoview-arm64-v8a
