name: UI check

# Manual only: builds Facet for the x86_64 emulator, runs it on Android 14 and takes screenshots of the welcome
# screen, home page, menu, a settings page and a web page. The screenshots are pushed to the `ui-shots` branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Find the GeckoView version for x86_64
        id: gv
        run: |
          base=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-x86_64
          curl -fsSL "$base/maven-metadata.xml" -o gv.xml
          v=$(grep -oP '(?<=<release>)[^<]+' gv.xml || true)
          if [ -z "$v" ]; then v=$(grep -oP '(?<=<version>)[^<]+' gv.xml | tail -1); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=GeckoView::x86_64 $v"

      - name: Build debug APK (x86_64)
        run: gradle --no-daemon --console=plain assembleDebug -PversionName=check -PgeckoVersion=${{ steps.gv.outputs.version }} -PgeckoArtifact=geckoview-x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ui-check.sh

      - name: Push screenshots to the ui-shots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git config user.name "Facet UI check"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b ui-shots
          git add -A
          git commit -q -m "UI check screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-shots
