name: Build Facet

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Work out the Facet version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the GeckoView version
        id: gv
        run: |
          if grep -q '^geckoVersion=LATEST' gradle.properties; then
            base=https://maven.mozilla.org/maven2/org/mozilla/geckoview
            found=""
            for art in geckoview-arm64-v8a geckoview-omni geckoview; do
              if curl -fsSL "$base/$art/maven-metadata.xml" -o gv.xml 2>/dev/null; then
                v=$(grep -oP '(?<=<release>)[^<]+' gv.xml || true)
                if [ -z "$v" ]; then v=$(grep -oP '(?<=<version>)[^<]+' gv.xml | tail -1); fi
                if [ -n "$v" ]; then found="$v"; echo "artifact=$art" >> "$GITHUB_OUTPUT"; break; fi
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::Could not find GeckoView on maven.mozilla.org"
              exit 1
            fi
            echo "args=-PgeckoVersion=$found" >> "$GITHUB_OUTPUT"
            echo "::notice title=GeckoView::Using $found"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice title=GeckoView::Using the version pinned in gradle.properties"
          fi

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.FACET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/facet.jks"
            echo "FACET_KEYSTORE=$RUNNER_TEMP/facet.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          FACET_KEYSTORE_PASSWORD: ${{ secrets.FACET_KEYSTORE_PASSWORD }}
          FACET_KEY_ALIAS: ${{ secrets.FACET_KEY_ALIAS }}
          FACET_KEY_PASSWORD: ${{ secrets.FACET_KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug -PversionName=${{ steps.ver.outputs.name }} ${{ steps.gv.outputs.args }} ${{ steps.gv.outputs.artifact != '' && format('-PgeckoArtifact={0}', steps.gv.outputs.artifact) || '' }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E '^e: |What went wrong|Execution failed|error:|Could not resolve|requires' -A3 build.log | head -90 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Facet-v${{ steps.ver.outputs.name }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Facet-v${{ steps.ver.outputs.name }}
          path: Facet-v*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Facet v${{ steps.ver.outputs.name }}
          files: Facet-v*.apk
