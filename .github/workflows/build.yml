name: Build Facet

on:
  push:
    branches: ['**', '!ui-shots', '!ui-check']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (for example v1.0). Leave empty for a plain test build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Work out the Facet version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.release_tag }}" == v* ]]; then
            t="${{ github.event.inputs.release_tag }}"
            echo "name=${t#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the GeckoView version
        id: gv
        run: |
          if grep -q '^geckoVersion=LATEST' gradle.properties; then
            base=https://maven.mozilla.org/maven2/org/mozilla/geckoview
            found=""
            for art in geckoview-arm64-v8a geckoview-omni geckoview; do
              if curl -fsSL "$base/$art/maven-metadata.xml" -o gv.xml 2>/dev/null; then
                v=$(grep -oP '(?<=<release>)[^<]+' gv.xml || true)
                if [ -z "$v" ]; then v=$(grep -oP '(?<=<version>)[^<]+' gv.xml | tail -1); fi
                if [ -n "$v" ]; then found="$v"; echo "artifact=$art" >> "$GITHUB_OUTPUT"; break; fi
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::Could not find GeckoView on maven.mozilla.org"
              exit 1
            fi
            echo "args=-PgeckoVersion=$found" >> "$GITHUB_OUTPUT"
            echo "::notice title=GeckoView::Using $found"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice title=GeckoView::Using the version pinned in gradle.properties"
          fi

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.FACET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # a secret pasted on Windows can carry a line break (CR LF) or spaces; base64 rejects them
            clean=$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ')
            # safe to show: the length, whether it starts like a keystore (all do: MII...) and stray characters
            echo "keystore secret: ${#clean} characters, starts like a keystore: $([[ "$clean" == MII* ]] && echo yes || echo no), characters outside base64: $(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)"
            printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/facet.jks"
            echo "FACET_KEYSTORE=$RUNNER_TEMP/facet.jks" >> "$GITHUB_ENV"
          fi

      # Releases (a v* tag, or a manual run with a release tag) get the stable build: shrunk by R8 and signed with the
      # private release key from the FACET_KEYSTORE secrets, which they refuse to go without. Other pushes build the
      # quicker debug APK, signed with the shared debug key.
      - name: Build the APK
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.release_tag, 'v') }}
          FACET_KEYSTORE_PASSWORD: ${{ secrets.FACET_KEYSTORE_PASSWORD }}
          FACET_KEY_ALIAS: ${{ secrets.FACET_KEY_ALIAS }}
          FACET_KEY_PASSWORD: ${{ secrets.FACET_KEY_PASSWORD }}
        run: |
          set +e
          # the same for the passwords and alias: drop stray line breaks from pasting
          export FACET_KEYSTORE_PASSWORD="$(printf '%s' "$FACET_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export FACET_KEY_ALIAS="$(printf '%s' "$FACET_KEY_ALIAS" | tr -d '\r\n ')"
          export FACET_KEY_PASSWORD="$(printf '%s' "$FACET_KEY_PASSWORD" | tr -d '\r\n')"
          task=assembleDebug
          if [ "$RELEASE" = "true" ]; then
            if [ -z "$FACET_KEYSTORE" ]; then
              echo "::error title=Signing::A release needs the FACET_KEYSTORE_B64, FACET_KEYSTORE_PASSWORD, FACET_KEY_ALIAS and FACET_KEY_PASSWORD secrets"
              exit 1
            fi
            task=assembleRelease
          fi
          gradle --no-daemon --console=plain $task -PversionName=${{ steps.ver.outputs.name }} ${{ steps.gv.outputs.args }} ${{ steps.gv.outputs.artifact != '' && format('-PgeckoArtifact={0}', steps.gv.outputs.artifact) || '' }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E '^e: |What went wrong|Execution failed|error:|Could not resolve|requires' -A3 build.log | head -90 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code

      - name: Name the APK
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "Facet-v${{ steps.ver.outputs.name }}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "Facet-v${{ steps.ver.outputs.name }}-debug.apk"
          fi

      # Test builds keep their files for two days only, and a full artifact quota does not fail them; releases need the upload.
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.event.inputs.release_tag, 'v') }}
        with:
          name: Facet-v${{ steps.ver.outputs.name }}
          path: Facet-v*.apk
          retention-days: 2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the Facet version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.release_tag }}" == v* ]]; then
            t="${{ github.event.inputs.release_tag }}"
            echo "name=${t#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=3.0" >> "$GITHUB_OUTPUT"
          fi

      # The browser, its uninstaller, the update zip and the paper installer (Facet-v<version>-Setup.exe), all in dist/
      - name: Build Facet for Windows
        shell: pwsh
        run: |
          pwsh windows/build.ps1 -Version "${{ steps.ver.outputs.name }}" -Out dist 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist/Facet-v${{ steps.ver.outputs.name }}-Setup.exe")) {
            $msg = (Select-String -Path build.log -Pattern 'error ' | ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 60) -join '%0A'
            Write-Output "::error title=Windows build errors::$msg"
            exit 1
          }

      - name: Smoke test (opens real sites with the built browser)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:FACET_SMOKE = "1"
          $p = Start-Process -FilePath "build-work\app\Facet.exe" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "::warning title=smoke::Facet did not finish in 5 minutes" }
          $dir = Join-Path $env:LOCALAPPDATA "Facet"
          $f = Join-Path $dir "smoke.txt"
          if (Test-Path $f) {
            $lines = Get-Content $f | Where-Object { $_.Trim() }
            $sites = ($lines | Where-Object { $_ -like 'SITE*' }) -join '%0A'
            $feat = ($lines | Where-Object { $_ -notlike 'SITE*' }) -join '%0A'
            Write-Output "::notice title=smoke-sites::$sites"
            Write-Output "::notice title=smoke-features::$feat"
          } else {
            Write-Output "::error title=smoke::no report written (exit code $($p.ExitCode))"
          }
          $log = Join-Path $dir "cef.log"
          if (Test-Path $log) { Write-Output ("::notice title=cef-log::" + ((Get-Content $log -Tail 15) -join '%0A')) }

      # Installs silently into a temporary folder, checks Facet and its registration are there, then uninstalls and
      # checks everything is gone. A broken installer fails the build.
      - name: Installer test (install, then uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "FacetInstallTest"
          $setup = "dist\Facet-v${{ steps.ver.outputs.name }}-Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/silent", "`"/dir=$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $env:TEMP "facet-setup-error.txt") -ErrorAction SilentlyContinue; Write-Output "::error title=installer::setup exited with $($p.ExitCode)"; exit 1 }
          foreach ($f in "Facet.exe", "uninstall.exe", "facet-install.json") { if (-not (Test-Path (Join-Path $dir $f))) { Write-Output "::error title=installer::$f missing after install"; exit 1 } }
          if (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Facet")) { Write-Output "::error title=installer::no Apps & features entry"; exit 1 }
          if (-not (Test-Path "HKCU:\Software\Clients\StartMenuInternet\Facet")) { Write-Output "::error title=installer::not registered as a browser"; exit 1 }
          $u = Start-Process -FilePath (Join-Path $dir "uninstall.exe") -ArgumentList "/silent" -PassThru -Wait
          Start-Sleep 3
          if ($u.ExitCode -ne 0 -or (Test-Path (Join-Path $dir "Facet.exe")) -or (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Facet")) {
            Write-Output "::error title=installer::uninstall left Facet behind (exit $($u.ExitCode))"; exit 1
          }
          Write-Output "::notice title=installer::install and uninstall both work"

      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.event.inputs.release_tag, 'v') }}
        with:
          name: Facet-v${{ steps.ver.outputs.name }}-windows
          retention-days: 2
          path: |
            dist/Facet-v*-Setup.exe
            dist/Facet-v*-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.release_tag, 'v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release (Android and Windows together)
        uses: softprops/action-gh-release@v2
        with:
          name: Facet ${{ github.event.inputs.release_tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/*
