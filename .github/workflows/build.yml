name: Build Facet

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (for example v1.0). Leave empty for a plain test build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Work out the Facet version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.release_tag }}" == v* ]]; then
            t="${{ github.event.inputs.release_tag }}"
            echo "name=${t#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the GeckoView version
        id: gv
        run: |
          if grep -q '^geckoVersion=LATEST' gradle.properties; then
            base=https://maven.mozilla.org/maven2/org/mozilla/geckoview
            found=""
            for art in geckoview-arm64-v8a geckoview-omni geckoview; do
              if curl -fsSL "$base/$art/maven-metadata.xml" -o gv.xml 2>/dev/null; then
                v=$(grep -oP '(?<=<release>)[^<]+' gv.xml || true)
                if [ -z "$v" ]; then v=$(grep -oP '(?<=<version>)[^<]+' gv.xml | tail -1); fi
                if [ -n "$v" ]; then found="$v"; echo "artifact=$art" >> "$GITHUB_OUTPUT"; break; fi
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::Could not find GeckoView on maven.mozilla.org"
              exit 1
            fi
            echo "args=-PgeckoVersion=$found" >> "$GITHUB_OUTPUT"
            echo "::notice title=GeckoView::Using $found"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice title=GeckoView::Using the version pinned in gradle.properties"
          fi

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.FACET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/facet.jks"
            echo "FACET_KEYSTORE=$RUNNER_TEMP/facet.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          FACET_KEYSTORE_PASSWORD: ${{ secrets.FACET_KEYSTORE_PASSWORD }}
          FACET_KEY_ALIAS: ${{ secrets.FACET_KEY_ALIAS }}
          FACET_KEY_PASSWORD: ${{ secrets.FACET_KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug -PversionName=${{ steps.ver.outputs.name }} ${{ steps.gv.outputs.args }} ${{ steps.gv.outputs.artifact != '' && format('-PgeckoArtifact={0}', steps.gv.outputs.artifact) || '' }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E '^e: |What went wrong|Execution failed|error:|Could not resolve|requires' -A3 build.log | head -90 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Facet-v${{ steps.ver.outputs.name }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Facet-v${{ steps.ver.outputs.name }}
          path: Facet-v*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the Facet version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.release_tag }}" == v* ]]; then
            t="${{ github.event.inputs.release_tag }}"
            echo "name=${t#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Facet for Windows
        shell: bash
        run: |
          set +e
          dotnet publish windows/Facet.Windows.csproj -c Release -r win-x64 --self-contained -p:Version=${{ steps.ver.outputs.name }} -o publish 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E 'error ' build.log | sort -u | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Windows build errors::${msg}"
          fi
          exit $code

      - name: Smoke test (opens real sites with the built browser)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:FACET_SMOKE = "1"
          $p = Start-Process -FilePath "publish\Facet.exe" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "::warning title=smoke::Facet did not finish in 5 minutes" }
          $dir = Join-Path $env:LOCALAPPDATA "Facet"
          $f = Join-Path $dir "smoke.txt"
          if (Test-Path $f) {
            $lines = Get-Content $f | Where-Object { $_.Trim() }
            $sites = ($lines | Where-Object { $_ -like 'SITE*' }) -join '%0A'
            $feat = ($lines | Where-Object { $_ -notlike 'SITE*' }) -join '%0A'
            Write-Output "::notice title=smoke-sites::$sites"
            Write-Output "::notice title=smoke-features::$feat"
          } else {
            Write-Output "::error title=smoke::no report written (exit code $($p.ExitCode))"
          }
          $log = Join-Path $dir "cef.log"
          if (Test-Path $log) { Write-Output ("::notice title=cef-log::" + ((Get-Content $log -Tail 15) -join '%0A')) }

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "Facet-v${{ steps.ver.outputs.name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Facet-v${{ steps.ver.outputs.name }}-windows
          path: Facet-v*-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.release_tag, 'v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release (Android and Windows together)
        uses: softprops/action-gh-release@v2
        with:
          name: Facet ${{ github.event.inputs.release_tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
