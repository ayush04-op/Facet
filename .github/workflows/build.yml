name: Build Facet

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.FACET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/facet.jks"
            echo "FACET_KEYSTORE=$RUNNER_TEMP/facet.jks" >> "$GITHUB_ENV"
            echo "Using the release keystore from repository secrets."
          else
            echo "No FACET_KEYSTORE_B64 secret: this build is signed with a throwaway debug key."
          fi

      - name: Build debug APK
        env:
          FACET_KEYSTORE_PASSWORD: ${{ secrets.FACET_KEYSTORE_PASSWORD }}
          FACET_KEY_ALIAS: ${{ secrets.FACET_KEY_ALIAS }}
          FACET_KEY_PASSWORD: ${{ secrets.FACET_KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug -PversionName=${{ steps.ver.outputs.name }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E '^e: |What went wrong|Execution failed|error:' -A3 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Facet-v${{ steps.ver.outputs.name }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Facet-v${{ steps.ver.outputs.name }}
          path: Facet-v*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Facet v${{ steps.ver.outputs.name }}
          files: Facet-v*.apk
